name: MQSS Client Testing

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt-get install -y \
            software-properties-common \
            cmake \
            librabbitmq-dev \
            libboost-dev \
            libgtest-dev \
            libgmock-dev \
            libcurl4-openssl-dev

          python3 -m pip install --upgrade pip
          pip install uv pre-commit

      - name: Run pre-commit
        run: |
          pre-commit install
          pre-commit run --all-files

      - name: Configure project
        run: |
          cmake -S . -B build -DMQSSCLIENT_BUILD_UNIT_TESTS=ON

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt-get install -y \
            cmake \
            librabbitmq-dev \
            libboost-dev \
            libgtest-dev \
            libgmock-dev \
            libcurl4-openssl-dev \
            gcovr

      # Instrument the whole build (library and tests); MQSSCLIENT_ENABLE_COVERAGE
      # only instruments the test executables.
      - name: Configure with coverage instrumentation
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMQSSCLIENT_BUILD_UNIT_TESTS=ON \
            -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage \
            -DCMAKE_EXE_LINKER_FLAGS=--coverage -DCMAKE_SHARED_LINKER_FLAGS=--coverage

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Collect coverage
        run: gcovr --root . --filter src/ --filter include/ --xml coverage.xml --print-summary build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Switch to true (as in QDMI) once the repository is registered with Codecov.
          fail_ci_if_error: false
          files: coverage.xml
          flags: cpp

  required-checks-pass: # This job does nothing and is only used for branch protection
    name: 🚦 Check
    if: always()
    needs:
      - build
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
