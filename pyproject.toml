[build-system]
requires = [
    "scikit-build-core>=0.12.2",
    "pybind11>=2.13.0",
    "setuptools-scm>=9.2",
]
build-backend = "scikit_build_core.build"
[project]
name = "mqss-client"
description = "Unified client SDK for the Munich Quantum Software Stack (MQSS)"
readme = "README.md"
authors = [
    { name = "Munich Quantum Software Stack", email = "mqss@munich-quantum-valley.de" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dynamic = ["version"]
keywords = [
    "mqss",
    "quantum-computing",
    "quantum",
    "hpc",
    "rabbitmq",
    "distributed-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
[project.urls]
Homepage = "https://github.com/Munich-Quantum-Software-Stack/MQSS-Client"
Repository = "https://github.com/Munich-Quantum-Software-Stack/MQSS-Client"
Issues = "https://github.com/Munich-Quantum-Software-Stack/MQSS-Client/issues"
[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
]
[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}/{build_type}"
cmake.build-type = "Release"
wheel.install-dir = "mqss/client"
wheel.packages = ["python/mqss"]
install.components = ["mqss_client_bindings"]
sdist.include = [
    "bindings/",
    "cmake/",
    "docs/",
    "include/",
    "python/",
    "src/",
    "tests/",
    "CMakeLists.txt",
]
sdist.exclude = [
    "**/.github",
    "**/__pycache__",
    "**/*.pyc",
]
[tool.scikit-build.cmake.define]
BUILD_TESTS = "OFF"
BUILD_BINDINGS = "ON"
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"
[tool.setuptools_scm]
local_scheme = "no-local-version"
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests"
]
addopts = [
    "-ra",
    "--showlocals",
]
pythonpath = [
    "python"
]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
[tool.cibuildwheel]
build = "cp3*"
skip = [
    "*-musllinux_*",
]
archs = "auto64"
build-frontend = "build"
test-command = "pytest {project}/tests"
[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
build.targets = [
  "mqss_client_bindings", "libmqss_client"
]
